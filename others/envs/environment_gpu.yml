name: exoplanet_dl_gpu
channels:
  - conda-forge
  - nvidia
  - defaults
dependencies:
  - python=3.11
  # Core data science / numerical packages
  - numpy>=1.24
  - pandas>=2.1
  - scipy>=1.11
  - scikit-learn>=1.2
  - h5py>=3.9
  # Astronomy / FITS specific
  - astropy>=5.3
  - astroquery>=0.4
  - lightkurve>=2.4
  - pydl>=0.7
  - oktopus>=0.1
  # Machine Learning (GPU)
  - cudatoolkit=11.8
  - cuda-nvcc=11.8
  - tensorflow=2.13.*
  - tf-agents>=0.19
  - tensorflow-probability>=0.20
  # Utilities
  - tqdm
  - pyyaml
  - matplotlib>=3.7
  - seaborn
  - plotly
  - graphviz
  - python-graphviz
  - umap-learn
  - dask
  - mpi4py
  - jupyterlab